# Production host for a published image. The deploy workflow copies this file
# and deploy.sh to ~/burrow-brigade on the server and writes BURROW_IMAGE to .env.
name: burrow-brigade
services:
  burrow:
    image: ${BURROW_IMAGE:?Set BURROW_IMAGE in .env}
    ports:
      - "4388:4388"
    volumes:
      - burrow-data:/var/lib/burrow
    restart: unless-stopped
    # SIGTERM saves the rooms before the container exits.
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  burrow-data:
