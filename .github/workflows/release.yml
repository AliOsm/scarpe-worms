name: GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v<version>); test-rel-<version>-<name> requires draft
        required: true
        type: string
      draft:
        description: Keep the verified release as a draft
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      draft: ${{ steps.meta.outputs.draft }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the existing tag against Burrow::VERSION and resolve its commit
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DRAFT: ${{ (github.event_name == 'workflow_dispatch' && inputs.draft) || startsWith(github.ref_name, 'test-rel-') }}
        run: python3 -I tools/release.py metadata --tag "$TAG" --draft "$DRAFT"
      - name: Release validation and publication safety regressions
        run: python3 -I tools/test_release.py

  macos:
    needs: prepare
    uses: ./.github/workflows/package-macos.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  windows:
    needs: prepare
    uses: ./.github/workflows/package-windows.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  linux:
    needs: prepare
    uses: ./.github/workflows/package-linux.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  server:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image on its native architecture
        run: |
          docker buildx build --platform "linux/$ARCH" --load --provenance=false --tag "$IMAGE" \
            --label org.opencontainers.image.title=burrow-brigade \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" .
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = "$ARCH"
      - name: Export and reload the exact release image
        run: |
          mkdir -p dist
          archive="Burrow-Brigade-server-$VERSION-docker-linux-$ARCH.tar.gz"
          docker save "$IMAGE" | gzip -n > "dist/$archive"
          docker image rm "$IMAGE"
          docker load --input "dist/$archive"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - name: Required TLS six-team match, healthcheck, restart, session and certificate recovery
        run: python3 -I tools/check_container.py --image "$IMAGE" --report "docs/validation/container-$ARCH.json"
      - uses: actions/upload-artifact@v4
        with:
          name: burrow-brigade-server-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-evidence-${{ matrix.arch }}
          path: docs/validation/container-*.json

  release:
    needs: [prepare, macos, windows, linux, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: burrow-brigade-*
          path: downloaded
      - name: Validate every asset, write checksums, Compose file, provenance and release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: python3 -I tools/release.py assemble --tag "$TAG" --sha "$SOURCE_SHA" --draft "$DRAFT" --artifacts downloaded --output release-assets --notes release-notes.md
      - name: Upload to a draft, verify uploaded bytes, then publish if requested
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: python3 -I tools/release.py publish --tag "$TAG" --sha "$SOURCE_SHA" --draft "$DRAFT" --assets release-assets --notes release-notes.md
