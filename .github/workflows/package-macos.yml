name: Package macOS
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or immutable commit to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (empty means this workflow revision)
        type: string
      compare_audio:
        description: Compare Apple OpenAL and packaged OpenAL Soft on the same runner
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/package-macos.yml
      - packaging/macos/**
      - patches/scarpe/**
      - SCARPE_REVISION
      - rust-toolchain.toml
      - Gemfile*
      - setup.sh
      - tools/package_macos.py
      - packaging/macos/alsoftrc
      - tools/build_ruby.py
      - packaging/ruby/**
      - tools/check_package.py
      - tools/package_smoke.rb
      - tools/check_distributable.py
      - tools/verify_macos.py
      - tools/check_waits.*
      - tools/check_rendering.*
      - tools/check_macos_audio.py
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler: '4.0.16'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Apple silicon and prepare build tools
        run: |
          test "$(uname -m)" = arm64
          brew install pkg-config cmake
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/scarpe/native/target
          key: native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'SCARPE_REVISION', 'patches/scarpe/*.patch') }}
      - run: ./setup.sh
      - run: bundle exec rake test
      - name: Native delayed-input prediction and comparison switch
        run: ./bin/check-native checks/prediction.sspec
      - name: Native short throws, wall rebounds and water skimming
        run: ./bin/check-native checks/physics.sspec
      - uses: actions/cache@v4
        with:
          path: .cache/macos
          key: macos-ruby4-arm64-${{ hashFiles('packaging/macos/dependencies.json', 'packaging/ruby/dependencies.json', 'tools/build_ruby.py', 'rust-toolchain.toml', 'SCARPE_REVISION', 'patches/scarpe/*.patch') }}
      - run: python3 -I tools/package_macos.py
      # These helpers import other repository helpers; isolated mode explicitly
      # adds only the trusted tools directory, never downloaded Python code.
      - run: python3 -I -c 'import runpy,sys; sys.path.insert(0,"tools"); runpy.run_path("tools/check_distributable.py",run_name="__main__")'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-candidate
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-evidence
          path: |
            docs/validation/macos-arm64-package.json
            docs/validation/distributable.json

  verify:
    needs: package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-package-candidate
          path: dist
      - name: Require an Apple silicon runner
        run: |
          test "$(uname -m)" = arm64
          sw_vers
      - name: Verify and extract the delivered archive
        run: |
          (cd dist && shasum -a 256 -c ./*.sha256)
          mkdir -p 'relocated/Brigade Équipe'
          ditto -x -k dist/Burrow-Brigade-*-macos-arm64.zip 'relocated/Brigade Équipe'
          codesign --verify --deep --strict --verbose=2 'relocated/Brigade Équipe/Burrow Brigade.app'
          python3 -I tools/verify_macos.py 'relocated/Brigade Équipe/Burrow Brigade.app'
      - name: Required packaged menu, bot match, input, clean quit and saved-match recovery
        run: |
          python3 -I tools/check_package.py 'relocated/Brigade Équipe/Burrow Brigade.app'
          python3 -I tools/check_package.py 'relocated/Brigade Équipe/Burrow Brigade.app' --windowed --locale c
      - name: Informational packaged deadline timer benchmark
        id: waits
        continue-on-error: true
        run: python3 -I -c 'import runpy,sys; sys.path.insert(0,"tools"); runpy.run_path("tools/check_waits.py",run_name="__main__")' --app 'relocated/Brigade Équipe/Burrow Brigade.app' --output docs/validation/waits-macos.json
      - name: Required packaged CoreAudio playback, panning, mute and resume
        run: python3 tools/check_macos_audio.py 'relocated/Brigade Équipe/Burrow Brigade.app'
      - name: Informational sustained combat, camera and audio benchmark
        id: rendering
        continue-on-error: true
        run: python3 -I -c 'import runpy,sys; sys.path.insert(0,"tools"); runpy.run_path("tools/check_rendering.py",run_name="__main__")' --app 'relocated/Brigade Équipe/Burrow Brigade.app' --audio --output docs/validation/rendering-macos.json --capture docs/validation/rendering-macos.png
      - name: Record benchmark outcomes
        if: always()
        env:
          WAITS: ${{ steps.waits.outcome }}
          RENDERING: ${{ steps.rendering.outcome }}
        run: |
          echo "macOS benchmarks (informational): waits=$WAITS; rendering=$RENDERING" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare audio backends under combat and rendering load
        if: inputs.compare_audio == true
        run: |
          python3 tools/compare_macos_audio.py 'relocated/Brigade Équipe/Burrow Brigade.app'
      - uses: actions/upload-artifact@v4
        with:
          name: burrow-brigade-macos
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-execution-evidence
          path: |
            docs/validation/package-macos-native*
            docs/validation/rendering-macos*
            docs/validation/waits-macos.json
            .cache/macos-audio-comparison/
