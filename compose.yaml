services:
  burrow:
    build: .
    ports:
      - "4388:4388"
    volumes:
      - burrow-data:/var/lib/burrow
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  burrow-data:
